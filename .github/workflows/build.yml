name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Organizar estrutura do projeto
        run: |
          mkdir -p app/src/main/java/com/example/yolotube
          mv *.kt app/src/main/java/com/example/yolotube/
          mv AndroidManifest.xml app/src/main/
          mv app.build.gradle.kts app/build.gradle.kts
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: YoloTube-apk
          path: app/build/outputs/apk/debug/app-debug.apk
